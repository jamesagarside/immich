# Docker Compose for Immich with Jetson Nano ML Support
# This is a minimal example for running Immich with the Jetson Nano ML container

version: '3.8'

name: immich-jetson-nano

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    command: ['start.sh', 'immich']
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_HOSTNAME=immich_postgres
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME}
      - REDIS_HOSTNAME=immich_redis
      - MACHINE_LEARNING_ENABLED=true
      - MACHINE_LEARNING_URL=http://immich-machine-learning:3003
    depends_on:
      - redis
      - database
      - immich-machine-learning
    restart: unless-stopped
    ports:
      - 2283:3001

  immich-microservices:
    container_name: immich_microservices
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    command: ['start.sh', 'microservices']
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_HOSTNAME=immich_postgres
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME}
      - REDIS_HOSTNAME=immich_redis
      - MACHINE_LEARNING_ENABLED=true
      - MACHINE_LEARNING_URL=http://immich-machine-learning:3003
    depends_on:
      - redis
      - database
      - immich-machine-learning
    restart: unless-stopped

  # Jetson Nano specific ML container
  immich-machine-learning:
    container_name: immich_machine_learning
    image: immich-ml-jetson-nano:latest  # Built using the Jetson Nano Dockerfile
    runtime: nvidia  # Required for GPU acceleration on Jetson
    volumes:
      - model-cache:/cache
    environment:
      - MACHINE_LEARNING_CACHE_FOLDER=/cache
      - DEVICE=cuda
      # Jetson Nano specific optimizations
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3g  # Limit memory usage on Jetson Nano
        reservations:
          memory: 512m
    ports:
      - 3003:3003

  redis:
    container_name: immich_redis
    image: redis:6.2-alpine@sha256:84882e87b54734154586e5f8abd4dce69fe7311315e2fc6d67c29614c8de2672
    restart: unless-stopped

  database:
    container_name: immich_postgres
    image: tensorchord/pgvector:pg14-v0.6.0@sha256:90724186f0a3517cf6914295b5ab410db9ce23190a2d9d0b9dd6463e3fa298f0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
  model-cache:
    # Use local storage for model cache on Jetson Nano
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MODEL_CACHE_LOCATION:-./model-cache}
